gradle.projectsEvaluated {
    def project = gradle.rootProject
    project.kotlin.sourceSets.named('test').get().kotlin.srcDir(project.file('experiments/ambient-memory'))
    project.tasks.register('writeAmbientMemoryClasspath') {
        dependsOn project.tasks.named('testClasses')
        doLast {
            project.file('build/ambient-memory-classpath.txt').text = project.sourceSets.test.runtimeClasspath.asPath
        }
    }
}
