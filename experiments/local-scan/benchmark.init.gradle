gradle.projectsEvaluated {
    def project = gradle.rootProject
    project.kotlin.sourceSets.named('test').get().kotlin.srcDir(project.file('experiments/local-scan'))
    project.tasks.register('writeLocalScanBenchmarkClasspath') {
        dependsOn project.tasks.named('testClasses')
        doLast {
            project.file('build/local-scan-benchmark-classpath.txt').text = project.sourceSets.test.runtimeClasspath.asPath
        }
    }
}
