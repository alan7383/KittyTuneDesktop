name: Build & Release All Universal Installers (Windows, macOS, Linux)

on:
  push:
    tags:
      - 'v*'
  # Run by hand: builds the installers as downloadable artifacts, never a release.
  workflow_dispatch:
    inputs:
      macos_only:
        description: 'Build only the macOS DMGs (arm64 + Intel)'
        type: boolean
        default: true

jobs:
  build-windows:
    name: Build Windows Installer (.msi, Portable .zip)
    if: github.event_name != 'workflow_dispatch' || !inputs.macos_only
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: git update-index --chmod=+x gradlew
        shell: bash

      - name: Build Windows MSI & Portable App
        run: .\gradlew.bat packageReleaseMsi zipWindowsPortable -PdesktopOnly=true --max-workers=2

      - name: Get Windows package version
        id: get_version
        run: |
          $version = (Select-String -Path build.gradle.kts -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        shell: powershell

      - name: Prepare Windows Distribution Binaries
        run: |
          mkdir dist-win
          Get-ChildItem -Path "build\compose\binaries\${{ steps.get_version.outputs.VERSION }}\main-release\msi\*.msi" | ForEach-Object { Copy-Item $_.FullName -Destination "dist-win\KittyTune-${{ steps.get_version.outputs.VERSION }}-x64.msi" }
          Copy-Item -LiteralPath "release\KittyTune-${{ steps.get_version.outputs.VERSION }}-Windows-Portable-x64.zip" -Destination dist-win
        shell: powershell

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: KittyTune-Windows
          path: dist-win/*

  build-macos:
    # One DMG per architecture: the bundled JDK and native libraries are those of the build machine,
    # so an Apple Silicon build does not open on an Intel Mac ("not supported on this Mac").
    name: Build macOS Installer (.dmg, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel
    env:
      # Native helpers (Swift, the DSP) target macOS 12+, not the runner's own version
      MACOSX_DEPLOYMENT_TARGET: '12.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew and scripts
        run: |
          chmod +x gradlew
          chmod +x scripts/*.sh 2>/dev/null || true

      - name: Build macOS DMG Package with Now Playing
        run: bash scripts/build-macos-nowplaying.sh --dmg

      - name: Get version from tag
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//')" >> $GITHUB_OUTPUT
          else
            # manual run: the DMG is named after the version in build.gradle.kts
            echo "VERSION=$(grep -m 1 '^version = ' build.gradle.kts | cut -d '"' -f 2)" >> $GITHUB_OUTPUT
          fi

      - name: Prepare macOS Binaries
        run: |
          mkdir -p dist-mac
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          if [ -f "dist-mac/KittyTune-${VERSION}.dmg" ]; then
            echo "DMG created at dist-mac/KittyTune-${VERSION}.dmg"
          elif [ -d "build/compose/binaries/main-release/dmg" ]; then
            cp build/compose/binaries/main-release/dmg/*.dmg "dist-mac/KittyTune-${VERSION}.dmg"
          fi
          mv "dist-mac/KittyTune-${VERSION}.dmg" "dist-mac/KittyTune-${VERSION}-${{ matrix.arch }}.dmg"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: KittyTune-macOS-${{ matrix.arch }}
          path: dist-mac/*

  build-linux-x64:
    name: Build Linux x64 Packages (.deb, .rpm, .pkg.tar.zst, .AppImage)
    if: github.event_name != 'workflow_dispatch' || !inputs.macos_only
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install packaging tools (rpm, fakeroot, zstd, file)
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot zstd binutils file python3-dbus python3-gi dbus-x11 xvfb xauth playerctl libasound2t64 libgl1

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Debug Icon
        run: ls -la src/main/resources/icons/ || true

      - name: Build Debian & RPM Packages
        run: ./gradlew packageReleaseDeb packageReleaseRpm

      - name: Get version from tag or build file
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//')" >> $GITHUB_OUTPUT
          else
            echo "VERSION=$(grep -m 1 '^version = ' build.gradle.kts | cut -d '"' -f 2)" >> $GITHUB_OUTPUT
          fi

      - name: Create Arch Linux x64 Package (.pkg.tar.zst)
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          mkdir -p arch_build/pkg
          DEB_FILE=$(find build -name "*.deb" | head -n 1)
          ar x "$DEB_FILE"
          tar -xf data.tar.* -C arch_build/pkg
          
          # Strip foreign native binaries from onnxruntime and sqlite-jdbc
          python3 -c '
          import zipfile, os, glob
          lib_dir = "arch_build/pkg/opt/kitty-tune/lib/app"
          for f in glob.glob(os.path.join(lib_dir, "onnxruntime-*.jar")):
              tmp = f + ".tmp"
              with zipfile.ZipFile(f, "r") as zin, zipfile.ZipFile(tmp, "w", compression=zipfile.ZIP_DEFLATED) as zout:
                  for item in zin.infolist():
                      if item.filename.startswith("ai/onnxruntime/native/") and not item.filename.startswith("ai/onnxruntime/native/linux-x64/"):
                          continue
                      zout.writestr(item, zin.read(item.filename))
              os.replace(tmp, f)
          for f in glob.glob(os.path.join(lib_dir, "sqlite-jdbc-*.jar")):
              tmp = f + ".tmp"
              with zipfile.ZipFile(f, "r") as zin, zipfile.ZipFile(tmp, "w", compression=zipfile.ZIP_DEFLATED) as zout:
                  for item in zin.infolist():
                      if item.filename.startswith("org/sqlite/native/") and not item.filename.startswith("org/sqlite/native/Linux/x86_64/"):
                          continue
                      zout.writestr(item, zin.read(item.filename))
              os.replace(tmp, f)
          '
          mkdir -p arch_build/pkg/DEBIAN
          tar -xf control.tar.* -C arch_build/pkg/DEBIAN
          dpkg-deb --root-owner-group -Zxz -b arch_build/pkg "$DEB_FILE"
          rm -rf arch_build/pkg/DEBIAN
          rm -f debian-binary control.tar.* data.tar.*
          
          mkdir -p arch_build/pkg/usr/share/applications
          mkdir -p arch_build/pkg/usr/share/icons/hicolor/256x256/apps
          
          cat << 'DESKTOP' > arch_build/pkg/usr/share/applications/kitty-tune.desktop
          [Desktop Entry]
          Name=KittyTune
          Exec=/opt/kitty-tune/bin/KittyTune
          Icon=kittytune
          Type=Application
          Categories=AudioVideo;Audio;
          DESKTOP
          
          cp arch_build/pkg/opt/kitty-tune/lib/KittyTune.png arch_build/pkg/usr/share/icons/hicolor/256x256/apps/kittytune.png
          
          cat << PKGEOF > arch_build/pkg/.PKGINFO
          pkgname = kitty-tune
          pkgver = ${VERSION}-1
          pkgdesc = KittyTune Desktop Music Player
          url = https://github.com/alan7383/KittyTuneDesktop
          builddate = REPLACE_BUILDDATE
          packager = GitHub Actions <actions@github.com>
          size = REPLACE_SIZE
          arch = x86_64
          license = custom
          depend = java-runtime>=17
          depend = hicolor-icon-theme
          depend = alsa-lib
          depend = gtk3
          PKGEOF
          
          PKG_SIZE=$(du -sk arch_build/pkg | cut -f1)
          PKG_DATE=$(date +%s)
          sed -i "s/REPLACE_SIZE/$PKG_SIZE/" arch_build/pkg/.PKGINFO
          sed -i "s/REPLACE_BUILDDATE/$PKG_DATE/" arch_build/pkg/.PKGINFO
          
          cd arch_build/pkg
          tar -cf - .PKGINFO * | zstd -19 -T0 -q - -o ../../kitty-tune-${VERSION}-1-x86_64.pkg.tar.zst
          cd ../..

      # Test the final Arch archive, which also supplies the AppImage payload.
      # The DEB and RPM use the same Gradle runtime image.
      - name: Verify packaged Linux x64 D-Bus integration
        run: bash scripts/check-linux-package.sh "kitty-tune-${{ steps.get_version.outputs.VERSION }}-1-x86_64.pkg.tar.zst"

      - name: Create Linux x64 AppImage Package (.AppImage)
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          mkdir -p appdir/usr/bin
          cp -r arch_build/pkg/* appdir/

          cat << 'EOF' | sed 's/^[[:space:]]*//' > appdir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export PATH="${HERE}/usr/bin:${HERE}/opt/kitty-tune/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${HERE}/opt/kitty-tune/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/opt/kitty-tune/bin/KittyTune" "$@"
          EOF
          chmod +x appdir/AppRun

          cp appdir/usr/share/applications/kitty-tune.desktop appdir/kitty-tune.desktop
          sed -i 's|^Exec=.*|Exec=KittyTune %U|' appdir/kitty-tune.desktop
          cp appdir/usr/share/icons/hicolor/256x256/apps/kittytune.png appdir/kittytune.png
          cp appdir/usr/share/icons/hicolor/256x256/apps/kittytune.png appdir/KittyTune.png
          cp appdir/usr/share/icons/hicolor/256x256/apps/kittytune.png appdir/.DirIcon
          ln -sf ../../opt/kitty-tune/bin/KittyTune appdir/usr/bin/KittyTune

          wget -q -O appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract
          ARCH=x86_64 ./squashfs-root/AppRun -n appdir "KittyTune-${VERSION}-x86_64.AppImage"
          rm -rf squashfs-root appimagetool.AppImage appdir

      - name: Prepare Linux x64 Distribution Binaries
        run: |
          mkdir -p dist-linux-x64
          find build -name "*.deb" -exec cp {} dist-linux-x64/ \;
          find build -name "*.rpm" -exec cp {} dist-linux-x64/ \;
          cp KittyTune-*-x86_64.AppImage dist-linux-x64/ 2>/dev/null || true
          cp kitty-tune-*-x86_64.pkg.tar.zst dist-linux-x64/ 2>/dev/null || true

      - name: Upload Linux x64 Packages
        uses: actions/upload-artifact@v7
        with:
          name: KittyTune-Linux-x64
          path: dist-linux-x64/*

  build-linux-arm64:
    name: Build Linux ARM64 Packages (.deb, .rpm, .pkg.tar.zst, .AppImage)
    if: github.event_name != 'workflow_dispatch' || !inputs.macos_only
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install packaging tools (rpm, fakeroot, zstd, file)
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot zstd binutils file python3-dbus python3-gi dbus-x11 xvfb xauth playerctl libasound2t64 libgl1

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Debug Icon
        run: ls -la src/main/resources/icons/ || true

      - name: Build Debian & RPM Packages
        run: ./gradlew packageReleaseDeb packageReleaseRpm

      - name: Get version from tag or build file
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//')" >> $GITHUB_OUTPUT
          else
            echo "VERSION=$(grep -m 1 '^version = ' build.gradle.kts | cut -d '"' -f 2)" >> $GITHUB_OUTPUT
          fi

      - name: Create Arch Linux ARM64 Package (.pkg.tar.zst)
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          mkdir -p arch_build_arm/pkg
          DEB_FILE=$(find build -name "*.deb" | head -n 1)
          ar x "$DEB_FILE"
          tar -xf data.tar.* -C arch_build_arm/pkg
          
          # Strip foreign native binaries from onnxruntime and sqlite-jdbc
          python3 -c '
          import zipfile, os, glob
          lib_dir = "arch_build_arm/pkg/opt/kitty-tune/lib/app"
          for f in glob.glob(os.path.join(lib_dir, "onnxruntime-*.jar")):
              tmp = f + ".tmp"
              with zipfile.ZipFile(f, "r") as zin, zipfile.ZipFile(tmp, "w", compression=zipfile.ZIP_DEFLATED) as zout:
                  for item in zin.infolist():
                      if item.filename.startswith("ai/onnxruntime/native/") and not item.filename.startswith("ai/onnxruntime/native/linux-aarch64/"):
                          continue
                      zout.writestr(item, zin.read(item.filename))
              os.replace(tmp, f)
          for f in glob.glob(os.path.join(lib_dir, "sqlite-jdbc-*.jar")):
              tmp = f + ".tmp"
              with zipfile.ZipFile(f, "r") as zin, zipfile.ZipFile(tmp, "w", compression=zipfile.ZIP_DEFLATED) as zout:
                  for item in zin.infolist():
                      if item.filename.startswith("org/sqlite/native/") and not item.filename.startswith("org/sqlite/native/Linux/aarch64/"):
                          continue
                      zout.writestr(item, zin.read(item.filename))
              os.replace(tmp, f)
          '
          mkdir -p arch_build_arm/pkg/DEBIAN
          tar -xf control.tar.* -C arch_build_arm/pkg/DEBIAN
          dpkg-deb --root-owner-group -Zxz -b arch_build_arm/pkg "$DEB_FILE"
          rm -rf arch_build_arm/pkg/DEBIAN
          rm -f debian-binary control.tar.* data.tar.*
          
          mkdir -p arch_build_arm/pkg/usr/share/applications
          mkdir -p arch_build_arm/pkg/usr/share/icons/hicolor/256x256/apps
          
          cat << 'DESKTOP' > arch_build_arm/pkg/usr/share/applications/kitty-tune.desktop
          [Desktop Entry]
          Name=KittyTune
          Exec=/opt/kitty-tune/bin/KittyTune
          Icon=kittytune
          Type=Application
          Categories=AudioVideo;Audio;
          DESKTOP
          
          cp arch_build_arm/pkg/opt/kitty-tune/lib/KittyTune.png arch_build_arm/pkg/usr/share/icons/hicolor/256x256/apps/kittytune.png
          
          cat << PKGEOF > arch_build_arm/pkg/.PKGINFO
          pkgname = kitty-tune
          pkgver = ${VERSION}-1
          pkgdesc = KittyTune Desktop Music Player
          url = https://github.com/alan7383/KittyTuneDesktop
          builddate = REPLACE_BUILDDATE
          packager = GitHub Actions <actions@github.com>
          size = REPLACE_SIZE
          arch = aarch64
          license = custom
          depend = java-runtime>=17
          depend = hicolor-icon-theme
          depend = alsa-lib
          depend = gtk3
          PKGEOF
          
          PKG_SIZE=$(du -sk arch_build_arm/pkg | cut -f1)
          PKG_DATE=$(date +%s)
          sed -i "s/REPLACE_SIZE/$PKG_SIZE/" arch_build_arm/pkg/.PKGINFO
          sed -i "s/REPLACE_BUILDDATE/$PKG_DATE/" arch_build_arm/pkg/.PKGINFO
          
          cd arch_build_arm/pkg
          tar -cf - .PKGINFO * | zstd -19 -T0 -q - -o ../../kitty-tune-${VERSION}-1-aarch64.pkg.tar.zst
          cd ../..

      # Test the final Arch archive, which also supplies the AppImage payload.
      # The DEB and RPM use the same Gradle runtime image.
      - name: Verify packaged Linux ARM64 D-Bus integration
        run: bash scripts/check-linux-package.sh "kitty-tune-${{ steps.get_version.outputs.VERSION }}-1-aarch64.pkg.tar.zst"

      - name: Create Linux ARM64 AppImage Package (.AppImage)
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          mkdir -p appdir_arm/usr/bin
          cp -r arch_build_arm/pkg/* appdir_arm/

          cat << 'EOF' | sed 's/^[[:space:]]*//' > appdir_arm/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export PATH="${HERE}/usr/bin:${HERE}/opt/kitty-tune/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${HERE}/opt/kitty-tune/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/opt/kitty-tune/bin/KittyTune" "$@"
          EOF
          chmod +x appdir_arm/AppRun

          cp appdir_arm/usr/share/applications/kitty-tune.desktop appdir_arm/kitty-tune.desktop
          sed -i 's|^Exec=.*|Exec=KittyTune %U|' appdir_arm/kitty-tune.desktop
          cp appdir_arm/usr/share/icons/hicolor/256x256/apps/kittytune.png appdir_arm/kittytune.png
          cp appdir_arm/usr/share/icons/hicolor/256x256/apps/kittytune.png appdir_arm/KittyTune.png
          cp appdir_arm/usr/share/icons/hicolor/256x256/apps/kittytune.png appdir_arm/.DirIcon
          ln -sf ../../opt/kitty-tune/bin/KittyTune appdir_arm/usr/bin/KittyTune

          wget -q -O appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract
          ARCH=aarch64 ./squashfs-root/AppRun -n appdir_arm "KittyTune-${VERSION}-aarch64.AppImage"
          rm -rf squashfs-root appimagetool.AppImage appdir_arm

      - name: Prepare Linux ARM64 Distribution Binaries
        run: |
          mkdir -p dist-linux-arm64
          find build -name "*.deb" -exec cp {} dist-linux-arm64/ \;
          find build -name "*.rpm" -exec cp {} dist-linux-arm64/ \;
          cp KittyTune-*-aarch64.AppImage dist-linux-arm64/ 2>/dev/null || true
          cp kitty-tune-*-aarch64.pkg.tar.zst dist-linux-arm64/ 2>/dev/null || true

      - name: Upload Linux ARM64 Packages
        uses: actions/upload-artifact@v7
        with:
          name: KittyTune-Linux-arm64
          path: dist-linux-arm64/*

  release:
    name: Publish Universal GitHub Release
    # only for a pushed tag: a manual run just leaves its installers as artifacts
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos, build-linux-x64, build-linux-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v7
        with:
          name: KittyTune-Windows
          path: ./release-files

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: KittyTune-macOS-*
          merge-multiple: true
          path: ./release-files

      - name: Download Linux x64 Artifacts
        uses: actions/download-artifact@v7
        with:
          name: KittyTune-Linux-x64
          path: ./release-files

      - name: Download Linux ARM64 Artifacts
        uses: actions/download-artifact@v7
        with:
          name: KittyTune-Linux-arm64
          path: ./release-files

      - name: Get previous tag
        id: prev_tag
        run: |
          PREV=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
          if [ -z "$PREV" ]; then
            echo "range=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "range=${PREV}..${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prev=$PREV" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --strip header -- ${{ steps.prev_tag.outputs.range }}

      - name: Write changelog to file
        run: |
          echo "${{ steps.cliff.outputs.content }}" > CHANGELOG_RELEASE.md
          echo "" >> CHANGELOG_RELEASE.md
          if [ -n "${{ steps.prev_tag.outputs.prev }}" ]; then
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.prev_tag.outputs.prev }}...${{ github.ref_name }}" >> CHANGELOG_RELEASE.md
          fi

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.20' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'KittyTune Desktop v1.0.20' }}
          draft: false
          prerelease: false
          body_path: CHANGELOG_RELEASE.md
          files: ./release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Discord Release Notification ────────────────────────────────────────
      - name: Send Discord Release Notification
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.20' }}
        run: |
          python3 - << 'EOF'
          import os, json, urllib.request

          webhook_url = os.environ.get("DISCORD_WEBHOOK")
          if not webhook_url:
              print("No DISCORD_RELEASE_WEBHOOK configured, skipping.")
              exit(0)

          tag = os.environ.get("TAG_NAME", "")
          release_url = f"https://github.com/alan7383/KittyTuneDesktop/releases/tag/{tag}"

          changelog = ""
          if os.path.exists("CHANGELOG_RELEASE.md"):
              with open("CHANGELOG_RELEASE.md", "r", encoding="utf-8") as f:
                  changelog = f.read().strip()

          if len(changelog) > 1500:
              changelog = changelog[:1490] + "\n\n... *(full changelog on GitHub)*"

          payload = {
              "content": f"<@&1552727930801627166> **(=^･ω･^=) KittyTune Desktop {tag} is now available!**",
              "allowed_mentions": {
                  "roles": ["1552727930801627166"]
              },
              "embeds": [
                  {
                      "title": f"KittyTune Desktop {tag} (Windows, Linux, macOS)",
                      "url": release_url,
                      "description": changelog if changelog else f"KittyTune Desktop {tag} has been released!",
                      "color": 30868,
                      "fields": [
                          {
                              "name": "✦ Download Installers",
                              "value": f"[GitHub Releases & Packages]({release_url})\n*Windows (.msi, .zip), Linux (.deb, .rpm, .AppImage, .pkg.tar.zst), macOS (.dmg)*",
                              "inline": False
                          }
                      ],
                      "footer": {
                          "text": "KittyTune Desktop • Automated Release Pipeline"
                      }
                  }
              ]
          }

          req = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "GitHub-Actions-Release-Notifier"
              }
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print("Discord notification sent! Status:", resp.status)
          except Exception as e:
              print("Failed to send Discord notification:", e)
          EOF
