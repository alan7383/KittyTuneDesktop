name: Build & Release All Universal Installers (Windows, macOS, Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Installer (.msi, Portable .zip)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: git update-index --chmod=+x gradlew
        shell: bash

      - name: Build Windows MSI & Portable App
        run: .\gradlew.bat packageReleaseMsi createReleaseDistributable

      - name: Get version from tag
        id: get_version
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        shell: powershell

      - name: Prepare Windows Distribution Binaries
        run: |
          mkdir dist-win
          Get-ChildItem -Path build\compose\binaries\main-release\msi\*.msi | ForEach-Object { Copy-Item $_.FullName -Destination "dist-win\KittyTune-${{ steps.get_version.outputs.VERSION }}-x64.msi" }
          Compress-Archive -Path build\compose\binaries\main-release\app\* -DestinationPath dist-win\KittyTune-${{ steps.get_version.outputs.VERSION }}-Windows-Portable-x64.zip
        shell: powershell

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KittyTune-Windows
          path: dist-win/*

  build-macos:
    name: Build macOS Installer (.dmg)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build macOS DMG Package
        run: ./gradlew packageReleaseDmg

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//')" >> $GITHUB_OUTPUT

      - name: Prepare macOS Binaries
        run: |
          mkdir dist-mac
          cp build/compose/binaries/main-release/dmg/*.dmg dist-mac/KittyTune-${{ steps.get_version.outputs.VERSION }}.dmg

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KittyTune-macOS
          path: dist-mac/*

  build-linux-x64:
    name: Build Linux x64 Packages (.deb, .rpm, .pkg.tar.zst, .AppImage)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packaging tools (rpm, fakeroot, zstd)
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot zstd binutils

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Debug Icon
        run: ls -la src/main/resources/icons/ || true

      - name: Build Debian, RPM & AppImage Packages
        run: ./gradlew packageReleaseDeb packageReleaseRpm packageReleaseAppImage || ./gradlew packageReleaseDeb packageReleaseRpm

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//')" >> $GITHUB_OUTPUT

      - name: Create Arch Linux x64 Package (.pkg.tar.zst)
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          mkdir -p arch_build/pkg
          DEB_FILE=$(find build -name "*.deb" | head -n 1)
          ar x "$DEB_FILE"
          tar -xf data.tar.* -C arch_build/pkg
          
          mkdir -p arch_build/pkg/usr/share/applications
          mkdir -p arch_build/pkg/usr/share/icons/hicolor/256x256/apps
          
          cat << 'DESKTOP' > arch_build/pkg/usr/share/applications/kitty-tune.desktop
          [Desktop Entry]
          Name=KittyTune
          Exec=/opt/kitty-tune/bin/KittyTune
          Icon=kittytune
          Type=Application
          Categories=AudioVideo;Audio;
          DESKTOP
          
          cp arch_build/pkg/opt/kitty-tune/lib/KittyTune.png arch_build/pkg/usr/share/icons/hicolor/256x256/apps/kittytune.png
          
          cat << PKGEOF > arch_build/pkg/.PKGINFO
          pkgname = kitty-tune
          pkgver = ${VERSION}-1
          pkgdesc = KittyTune Desktop Music Player
          url = https://github.com/alan7383/KittyTuneDesktop
          builddate = REPLACE_BUILDDATE
          packager = GitHub Actions <actions@github.com>
          size = REPLACE_SIZE
          arch = x86_64
          license = custom
          depend = java-runtime>=17
          depend = hicolor-icon-theme
          depend = alsa-lib
          depend = gtk3
          PKGEOF
          
          PKG_SIZE=$(du -sk arch_build/pkg | cut -f1)
          PKG_DATE=$(date +%s)
          sed -i "s/REPLACE_SIZE/$PKG_SIZE/" arch_build/pkg/.PKGINFO
          sed -i "s/REPLACE_BUILDDATE/$PKG_DATE/" arch_build/pkg/.PKGINFO
          
          cd arch_build/pkg
          tar -cf - .PKGINFO * | zstd -z -q - -o ../../kitty-tune-${VERSION}-1-x86_64.pkg.tar.zst
          cd ../..

      - name: Upload Linux x64 Packages
        uses: actions/upload-artifact@v4
        with:
          name: KittyTune-Linux-x64
          path: |
            build/**/*.deb
            build/**/*.rpm
            build/**/*.AppImage
            kitty-tune-*-x86_64.pkg.tar.zst

  build-linux-arm64:
    name: Build Linux ARM64 Packages (.deb, .rpm, .pkg.tar.zst)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packaging tools (rpm, fakeroot, zstd)
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot zstd binutils

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Debug Icon
        run: ls -la src/main/resources/icons/ || true

      - name: Build Debian & RPM Packages
        run: ./gradlew packageReleaseDeb packageReleaseRpm

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=$(echo ${{ github.ref_name }} | sed 's/^v//')" >> $GITHUB_OUTPUT

      - name: Create Arch Linux ARM64 Package (.pkg.tar.zst)
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          mkdir -p arch_build_arm/pkg
          DEB_FILE=$(find build -name "*.deb" | head -n 1)
          ar x "$DEB_FILE"
          tar -xf data.tar.* -C arch_build_arm/pkg
          
          mkdir -p arch_build_arm/pkg/usr/share/applications
          mkdir -p arch_build_arm/pkg/usr/share/icons/hicolor/256x256/apps
          
          cat << 'DESKTOP' > arch_build_arm/pkg/usr/share/applications/kitty-tune.desktop
          [Desktop Entry]
          Name=KittyTune
          Exec=/opt/kitty-tune/bin/KittyTune
          Icon=kittytune
          Type=Application
          Categories=AudioVideo;Audio;
          DESKTOP
          
          cp arch_build_arm/pkg/opt/kitty-tune/lib/KittyTune.png arch_build_arm/pkg/usr/share/icons/hicolor/256x256/apps/kittytune.png
          
          cat << PKGEOF > arch_build_arm/pkg/.PKGINFO
          pkgname = kitty-tune
          pkgver = ${VERSION}-1
          pkgdesc = KittyTune Desktop Music Player
          url = https://github.com/alan7383/KittyTuneDesktop
          builddate = REPLACE_BUILDDATE
          packager = GitHub Actions <actions@github.com>
          size = REPLACE_SIZE
          arch = aarch64
          license = custom
          depend = java-runtime>=17
          depend = hicolor-icon-theme
          depend = alsa-lib
          depend = gtk3
          PKGEOF
          
          PKG_SIZE=$(du -sk arch_build_arm/pkg | cut -f1)
          PKG_DATE=$(date +%s)
          sed -i "s/REPLACE_SIZE/$PKG_SIZE/" arch_build_arm/pkg/.PKGINFO
          sed -i "s/REPLACE_BUILDDATE/$PKG_DATE/" arch_build_arm/pkg/.PKGINFO
          
          cd arch_build_arm/pkg
          tar -cf - .PKGINFO * | zstd -z -q - -o ../../kitty-tune-${VERSION}-1-aarch64.pkg.tar.zst
          cd ../..

      - name: Upload Linux ARM64 Packages
        uses: actions/upload-artifact@v4
        with:
          name: KittyTune-Linux-arm64
          path: |
            build/**/*.deb
            build/**/*.rpm
            kitty-tune-*-aarch64.pkg.tar.zst

  release:
    name: Publish Universal GitHub Release
    needs: [build-windows, build-macos, build-linux-x64, build-linux-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: KittyTune-Windows
          path: ./release-files

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: KittyTune-macOS
          path: ./release-files

      - name: Download Linux x64 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: KittyTune-Linux-x64
          path: ./release-files

      - name: Download Linux ARM64 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: KittyTune-Linux-arm64
          path: ./release-files

      - name: Get previous tag
        id: prev_tag
        run: |
          PREV=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || echo "")
          echo "Previous tag found: $PREV"
          if [ -z "$PREV" ]; then
            echo "range=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prev=" >> $GITHUB_OUTPUT
          else
            echo "range=${PREV}..${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prev=$PREV" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --strip header -- ${{ steps.prev_tag.outputs.range }}

      - name: Write changelog to file
        run: |
          echo "${{ steps.cliff.outputs.content }}" > CHANGELOG_RELEASE.md
          echo "" >> CHANGELOG_RELEASE.md
          if [ -n "${{ steps.prev_tag.outputs.prev }}" ]; then
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.prev_tag.outputs.prev }}...${{ github.ref_name }}" >> CHANGELOG_RELEASE.md
          fi

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.18' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'KittyTune Desktop v1.0.18' }}
          draft: false
          prerelease: false
          body_path: CHANGELOG_RELEASE.md
          files: ./release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
