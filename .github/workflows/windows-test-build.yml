# A Windows portable build for trying a fix on a real Windows machine, without cutting a release.
#
# Run it from the Actions tab (or `gh workflow run windows-test-build.yml`). Unzip the artifact anywhere;
# it leaves the real installation untouched and can be deleted afterwards.
name: Windows test build (portable)

on:
  workflow_dispatch:

jobs:
  build-windows-test:
    name: Windows portable zip
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: git update-index --chmod=+x gradlew
        shell: bash

      - name: Build SMTC bridge from source
        run: powershell -ExecutionPolicy Bypass -File scripts/build-smtc-bridge.ps1
        shell: powershell

      - name: Build portable app
        run: .\gradlew.bat createReleaseDistributable

      - name: Package portable zip
        run: |
          mkdir dist-test
          Compress-Archive -Path build\compose\binaries\main-release\app\* -DestinationPath dist-test\KittyTune-test-Windows-Portable-x64.zip
        shell: powershell

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: KittyTune-Windows-test
          path: dist-test/*
          retention-days: 14
