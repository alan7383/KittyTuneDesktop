# A build whose only job is to answer "where does the memory go?" (issue #33).
#
# The Java heap is capped at 2 GB, so an app reaching 4 GB has at least half of itself somewhere the
# heap cannot account for, and nothing a task manager shows can say where. The JVM can, but only if
# native memory tracking was switched on at startup, which takes a build of its own.
#
# It ships as a portable zip rather than an installer on purpose: whoever runs it keeps their real
# installation untouched, and can delete the folder afterwards.
#
# Run it from the Actions tab. The tester unzips it, uses the app normally until the memory climbs,
# closes it, and sends back %APPDATA%\KittyTune\memory.log.
name: Diagnostic build (memory)

on:
  workflow_dispatch:

jobs:
  build-windows-diagnostic:
    name: Windows portable, native memory tracking on
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: git update-index --chmod=+x gradlew
        shell: bash

      # -PmemDiag is the whole difference from a release build: it adds
      # -XX:NativeMemoryTracking=summary and -Dkittytune.memlog=true to the launcher options.
      - name: Build portable app with memory diagnostics
        run: .\gradlew.bat createReleaseDistributable -PmemDiag

      - name: Confirm the launcher really carries the flags
        run: |
          $cfg = Get-ChildItem -Recurse -Path build\compose\binaries\main-release\app -Filter *.cfg | Select-Object -First 1
          Write-Host "--- $($cfg.FullName) ---"
          Get-Content $cfg.FullName
          if (-not (Select-String -Path $cfg.FullName -Pattern 'NativeMemoryTracking' -Quiet)) {
            throw "NativeMemoryTracking is missing from the launcher config, the build would measure nothing"
          }
        shell: powershell

      - name: Package portable zip
        run: |
          mkdir dist-diag
          Compress-Archive -Path build\compose\binaries\main-release\app\* -DestinationPath dist-diag\KittyTune-memdiag-Windows-Portable-x64.zip
        shell: powershell

      - name: Upload diagnostic build
        uses: actions/upload-artifact@v4
        with:
          name: KittyTune-Windows-memory-diagnostic
          path: dist-diag/*
          retention-days: 30
