# Compiles the SMTC bridge on every push/PR so a C# regression is caught before a release build,
# rather than at release time.
name: SMTC bridge check

on:
  push:
    branches: [master]
    paths:
      - 'src/main/resources/native/WindowsSmtcBridge.cs'
      - 'scripts/build-smtc-bridge.ps1'
      - '.github/workflows/smtc-bridge-check.yml'
  pull_request:
    paths:
      - 'src/main/resources/native/WindowsSmtcBridge.cs'
      - 'scripts/build-smtc-bridge.ps1'
      - '.github/workflows/smtc-bridge-check.yml'
  workflow_dispatch:

jobs:
  compile-bridge:
    name: Compile SMTC bridge on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile bridge
        run: powershell -ExecutionPolicy Bypass -File scripts/build-smtc-bridge.ps1 -OutDir "$env:RUNNER_TEMP\bridge"
        shell: powershell

      - name: Smoke-test the built exe
        run: |
          $exe = "$env:RUNNER_TEMP\bridge\WindowsSmtcBridge.exe"
          if (-not (Test-Path $exe)) { throw "bridge exe missing: $exe" }
          # The bridge reads its protocol from stdin and exits when stdin closes.
          # We use Start-Process with redirection so winexe processes are waited on deterministically.
          $quit = "$env:RUNNER_TEMP\bridge\quit.txt"
          $stdout = "$env:RUNNER_TEMP\bridge\stdout.txt"
          $stderr = "$env:RUNNER_TEMP\bridge\stderr.txt"
          Set-Content -Path $quit -Value "QUIT"

          $p = Start-Process -FilePath $exe -RedirectStandardInput $quit -RedirectStandardOutput $stdout -RedirectStandardError $stderr -Wait -PassThru
          $out = if (Test-Path $stdout) { Get-Content $stdout } else { @() }
          $err = if (Test-Path $stderr) { Get-Content $stderr } else { @() }
          Write-Host "Process exit code: $($p.ExitCode)"
          Write-Host "STDOUT: $out"
          if ($err) { Write-Host "STDERR: $err" }

          if ($p.ExitCode -ne 0) { throw "bridge exited with code $($p.ExitCode): $out $err" }
          if ($out -notcontains 'READY') { throw "bridge did not report READY: $out $err" }
          Write-Host "Bridge reported READY: OK"
        shell: powershell
