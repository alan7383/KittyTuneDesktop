name: Windows portable and headless checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ['master']
    # Docs, website and translations cannot break the Windows build; skip those runs.
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - 'images/**'
      - '**.md'
      - 'src/main/resources/i18n/**'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # Force the MinGW toolchain for the native DSP DLL. The MSVC (/O2 /MT) build of
      # KittyTuneAudioDSP + ebur128 crashes headlessTest with STATUS_HEAP_CORRUPTION,
      # while the exact same sources pass under GCC on Linux/macOS runners. build-native-windows.ps1
      # prefers g++ when it is on PATH and only falls back to MSVC otherwise.
      - name: Install MinGW (preferred native compiler)
        run: choco install mingw --no-progress -y
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and package portable Windows app
        shell: pwsh
        run: ./scripts/build-windows.ps1 -JavaHome $env:JAVA_HOME
      - uses: actions/upload-artifact@v7
        with:
          name: KittyTune-Windows-Portable
          path: release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-test-reports
          path: |
            build/reports/tests/headlessTest
            build/test-results/headlessTest
            build/previews
