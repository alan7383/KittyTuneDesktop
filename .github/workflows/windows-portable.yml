name: Windows portable and headless checks

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Test startup cache preparation
        shell: pwsh
        run: python scripts/tests/test_startup_cache.py
      - name: Test and package portable Windows app
        shell: pwsh
        run: ./scripts/build-windows.ps1 -JavaHome $env:JAVA_HOME
      - name: Check packaged version file
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Get-ChildItem release/*-Windows-Portable-x64.zip | Select-Object -First 1
          $archive = [IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            function Read-Entry($name) {
              $entry = $archive.GetEntry($name)
              if (!$entry) { throw "Missing archive entry: $name" }
              $reader = [IO.StreamReader]::new($entry.Open())
              try { return $reader.ReadToEnd() } finally { $reader.Dispose() }
            }
            $version = (Read-Entry 'KittyTune/version.txt').Trim()
            $config = Read-Entry 'KittyTune/app/KittyTune.cfg'
            $match = [regex]::Match($config, '(?m)^java-options=-Djpackage\.app-version=(.+)')
            if (!$match.Success -or $version -ne $match.Groups[1].Value.Trim()) {
              throw 'version.txt does not match the packaged launcher'
            }
          } finally { $archive.Dispose() }
      - name: Test transparent window renderer fallback
        shell: pwsh
        run: ./gradlew.bat :test --tests '*TransparentWindowRenderingTest' -PdesktopOnly=true --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: KittyTune-Windows-Portable
          path: release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-test-reports
          path: |
            build/reports/tests/headlessTest
            build/test-results/headlessTest
            build/reports/tests/test
            build/test-results/test
            build/previews
