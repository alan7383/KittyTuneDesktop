name: Update Nix package from release

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Published KittyTune tag (for example, v1.6.0)
        required: true
        type: string

jobs:
  update-nix:
    if: >-
      (github.event_name != 'release' || !github.event.release.prerelease) &&
      (github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    concurrency:
      group: nix-release-update
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      UPDATE_BRANCH: automation/nix-release
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_BRANCH }}

      - name: Update version and hashes from the published release
        id: package
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping non-version tag $RELEASE_TAG"
            exit 0
          fi

          release=$(gh api "repos/$GH_REPO/releases/latest")
          latest_tag=$(jq -er '.tag_name' <<< "$release")
          if [[ "$latest_tag" != "$RELEASE_TAG" ]]; then
            echo "Skipping $RELEASE_TAG because the latest release is $latest_tag"
            exit 0
          fi

          python3 nix/update-release.py <<< "$release"
          if ! git diff --quiet -- nix/package.nix; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo "The Nix package already matches $RELEASE_TAG"
          fi

      - name: Publish the update branch and open a pull request
        if: steps.package.outputs.changed == 'true'
        shell: bash
        run: |
          update_ref="refs/heads/$UPDATE_BRANCH"
          remote_sha=$(git ls-remote origin "$update_ref" | cut -f1)
          if [[ -n "$remote_sha" ]]; then
            git fetch --no-tags origin "$update_ref"
            remote_sha=$(git rev-parse FETCH_HEAD)
          fi

          if [[ -z "$remote_sha" ]] || ! git diff --quiet "$remote_sha" --; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- nix/package.nix
            git commit -m "chore(nix): update KittyTune to $RELEASE_TAG"
            git push --force-with-lease="$update_ref:$remote_sha" origin "HEAD:$update_ref"
          fi

          existing_pr=$(gh api --method GET "repos/$GH_REPO/pulls" -f state=open \
            -f "head=${GH_REPO%/*}:$UPDATE_BRANCH" -f "base=$BASE_BRANCH" \
            --jq '.[0].number // empty')
          if [[ -z "$existing_pr" ]]; then
            gh pr create --head "$UPDATE_BRANCH" --base "$BASE_BRANCH" \
              --title 'chore(nix): update KittyTune package' \
              --body 'Update the Nix version and SHA-256 hashes from the latest published KittyTune release.'
          fi

      - name: Run the Nix check on the update branch
        if: steps.package.outputs.changed == 'true'
        # GITHUB_TOKEN pull request events can require manual approval.
        run: gh workflow run nix-check.yml --ref "$UPDATE_BRANCH"
