name: Update Nix package from release

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Published KittyTune tag (for example, v1.6.0)
        required: true
        type: string

jobs:
  update-nix:
    if: >-
      (github.event_name != 'release' || !github.event.release.prerelease) &&
      (github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    concurrency:
      group: nix-release-update
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_BRANCH }}

      - name: Check that the tag is the latest stable release
        id: release
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping non-version tag $RELEASE_TAG"
            exit 0
          fi

          latest_tag=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          if [[ "$latest_tag" != "$RELEASE_TAG" ]]; then
            echo "Skipping $RELEASE_TAG because the latest release is $latest_tag"
            exit 0
          fi
          echo 'eligible=true' >> "$GITHUB_OUTPUT"

      - name: Install Nix
        if: steps.release.outputs.eligible == 'true'
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Verify and publish the Nix package update
        if: steps.release.outputs.eligible == 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          base_ref="refs/heads/$BASE_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch --no-tags origin "$base_ref"
            base_commit=$(git rev-parse FETCH_HEAD)
            git checkout --detach "$base_commit"

            release=$(gh api "repos/$GH_REPO/releases/latest")
            latest_tag=$(jq -er '.tag_name' <<< "$release")
            if [[ "$latest_tag" != "$RELEASE_TAG" ]]; then
              echo "Skipping $RELEASE_TAG because the latest release is $latest_tag"
              exit 0
            fi
            python3 nix/update-release.py <<< "$release"

            changed=false
            if ! git diff --quiet -- nix/package.nix; then
              changed=true
              git add -- nix/package.nix
              git commit -m "chore(nix): update KittyTune to $RELEASE_TAG"
            else
              echo "The Nix package already matches $RELEASE_TAG"
              if [[ "$EVENT_NAME" != workflow_dispatch ]]; then
                exit 0
              fi
            fi

            nix flake check --no-write-lock-file
            package_output=$(nix build .#default --no-write-lock-file --no-link --print-out-paths --print-build-logs)
            test -x "$package_output/bin/kitty-tune"
            test -x "$package_output/bin/KittyTune"

            if [[ "$changed" == false ]]; then
              exit 0
            fi
            latest_tag=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
            if [[ "$latest_tag" != "$RELEASE_TAG" ]]; then
              echo "A newer release ($latest_tag) is available. Skipping $RELEASE_TAG."
              exit 0
            fi
            if git push origin "HEAD:$base_ref"; then
              exit 0
            fi

            remote_commit=$(git ls-remote --exit-code origin "$base_ref" | cut -f1)
            if [[ "$remote_commit" == "$base_commit" ]]; then
              echo "Push failed without a concurrent change to $BASE_BRANCH."
              exit 1
            fi
            echo "$BASE_BRANCH advanced during attempt $attempt. Trying again from the new tip."
          done

          echo "Could not publish the tested update after three attempts."
          exit 1
