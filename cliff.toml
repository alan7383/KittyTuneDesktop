[changelog]
header = ""
body = """
## {{ version }} ({{ now() | date(format="%Y-%m-%d") }})

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
* {{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/alan7383/KittyTuneDesktop/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false

commit_parsers = [
  { message = "^feat(\\(.+\\))?!:", group = "Breaking Changes" },
  { message = "^fix(\\(.+\\))?!:",  group = "Breaking Changes" },
  { message = "^feat",              group = "Features" },
  { message = "^fix",               group = "Bug Fixes" },
  { message = "^perf",              group = "Performance" },
  { message = "^refactor",          group = "Refactoring" },
  { message = "^docs",              group = "Documentation" },
  { message = "^chore|^ci|^build",  group = "Maintenance" },
  { message = "^test",              group = "Testing" },
  { message = "^style",             group = "Styling" },
]

filter_commits = false
tag_pattern = ".*"
skip_tags = ""
ignore_tags = ""
topo_order = true
sort_commits = "oldest"
